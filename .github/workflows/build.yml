name: Windows Installer Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Elle de başlatılabilsin

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows EXE ve Kurulum Sihirbazı

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.6,<6.11"
          pip install "PyMuPDF>=1.24"
          pip install pyinstaller

      - name: PyInstaller ile EXE derle
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "PDF Screen Shotter" `
            --add-data "core;core" `
            --add-data "models;models" `
            --add-data "services;services" `
            --add-data "ui;ui" `
            main.py

      - name: Inno Setup kur
        run: |
          choco install innosetup --yes

      - name: Kurulum sihirbazı (installer) oluştur
        run: |
          iscc installer.iss

      - name: Derlenmiş dosyaları yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Screen-Shotter-Windows-Installer
          path: Output/PDF_Screen_Shotter_Kurulum.exe
          retention-days: 30
